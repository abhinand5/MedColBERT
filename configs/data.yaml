# Data construction defaults.
# UMLS-derived outputs are private by default and should not be published.

umls:
  source: local
  local_dir: data/raw/umls
  private_hf_repo: null
  required_files:
    - MRCONSO.RRF
    - MRREL.RRF
    - MRSTY.RRF
  optional_files:
    - MRDEF.RRF

outputs:
  private_dir: data/processed/private
  public_dir: data/processed/public

filters:
  language: ENG
  suppress: N
  min_string_chars: 3
  max_string_chars: 160
  max_cuis_per_normalized_string: 3
  allow_abbreviations_only_if_unambiguous: true

vocab_groups:
  consumer:
    - CHV
  clinical:
    - SNOMEDCT_US
    - ICD10CM
    - ICD9CM
    - MSH
    - NCI
  drug:
    - RXNORM
    - VANDF

relations:
  hierarchical:
    - PAR
    - CHD
    - RB
    - RN
  related:
    - RO
    - RQ

passages:
  min_chars: 80
  max_tokens: 384
  overlap_tokens: 64
  sources:
    pubmed: data/raw/pubmed
    bioasq: data/raw/bioasq
    trec: data/raw/trec
    clinical_trials: data/raw/clinical_trials
    medembed_legacy: data/raw/medembed

training_sources:
  qrel_backed:
    enabled: true
    target_examples: 300000
    weight: 2.0
    sources:
      - bioasq
      - trec
  clinical_trials_synthetic:
    enabled: true
    target_examples: 400000
    weight: 1.5
    source: clinical_trials
  umls_concept_synthetic:
    enabled: true
    target_examples: 2900000
    weight: 1.75
    note: "Main scaling lever: passage-grounded, UMLS-grounded, teacher-filtered synthetic triplets. Citation contexts dropped from v1 in favor of scaling this source."
  medembed_legacy:
    enabled: false
    max_examples: 100000
    weight: 0.25
    note: "Use only for continuity ablations or a low-weight warm start; not a quality anchor."

quality_gates:
  require_teacher_margin: true
  minimum_teacher_margin: 0.15
  audit_acceptance_threshold: 0.8
  max_medembed_fraction: 0.05
  compare_synthetic_modes: true
  preferred_synthetic_mode: umls_grounded_teacher_filtered

decontamination:
  enabled: true
  minhash_threshold: 0.8
  num_perm: 128
  id_fields:
    - pmid
    - pmcid
    - nct_id

triplets:
  pilot_limit: 100000
  target_v1_limit: 3000000
  target_umls_grounded_synthetic_fraction:
    min: 0.70
    max: 0.85
  random_seed: 42
