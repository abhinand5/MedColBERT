[project]
name = "medcolbert"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=0.21.0",
    "datasets>=2.20.0",
    "huggingface-hub>=0.23.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "sentencepiece>=0.2.1",
    "torch>=2.3.0",
    "tqdm>=4.66.0",
    "transformers>=4.48.0",
    "typer>=0.12.0",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
data = [
    "datasketch>=1.6.4",
    "pyserini>=0.36.0",
]
eval = [
    "beir>=2.0.0",
    "ir-datasets>=0.5.0",
    "mteb>=1.14.0",
]
generation = [
    "dspy>=2.6.0",
    "litellm>=1.60.0",
]
training = [
    "pylate>=1.0.0",
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
