[project]
name = "medcolbert"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=0.21.0",
    "pyyaml>=6.0",
    "sentencepiece>=0.2.1",
    "torch>=2.11.0",
    "transformers>=5.6.2",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
data = [
    "pyserini>=0.36.0",
    "datasketch>=1.6.4",
]
eval = [
    "beir>=2.0.0",
    "ir-datasets>=0.5.0",
]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
